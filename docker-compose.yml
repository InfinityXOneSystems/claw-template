services:
  # MongoDB Database
  mongodb:
    image: mongo:7.0
    container_name: claw-mongodb
    restart: unless-stopped
    environment:
      MONGO_INITDB_DATABASE: claw-autonomous
    ports:
      - "27017:27017"
    volumes:
      - mongodb_data:/data/db
      - mongodb_config:/data/configdb
    networks:
      - claw-network
    healthcheck:
      test: echo 'db.runCommand("ping").ok' | mongosh localhost:27017/claw-autonomous --quiet
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 40s

  # Backend API Server
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: claw-backend
    restart: unless-stopped
    ports:
      - "5000:5000"
      - "5001:5001"
    environment:
      NODE_ENV: production
      PORT: 5000
      WS_PORT: 5001
      MONGODB_URI: mongodb://mongodb:27017/claw-autonomous
      JWT_SECRET: ${JWT_SECRET:-change-this-secret-in-production}
      JWT_EXPIRES_IN: 7d
      CLIENT_URL: http://localhost
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID:-}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET:-}
      LOG_LEVEL: info
      RATE_LIMIT_WINDOW_MS: 900000
      RATE_LIMIT_MAX_REQUESTS: 100
    depends_on:
      mongodb:
        condition: service_healthy
    networks:
      - claw-network
    volumes:
      - ./server/uploads:/app/server/uploads

  # Frontend React Application
  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
      args:
        - REACT_APP_API_URL=http://localhost:5000
        - REACT_APP_WS_URL=ws://localhost:5001
    container_name: claw-frontend
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - backend
    networks:
      - claw-network

networks:
  claw-network:
    driver: bridge

volumes:
  mongodb_data:
    driver: local
  mongodb_config:
    driver: local
