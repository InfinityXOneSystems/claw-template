<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Claw Chat - Black Theme</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="chat-container">
        <div class="chat-header">
            <div class="header-left">
                <div class="avatar">C</div>
                <div class="header-info">
                    <h2>Claw Chat</h2>
                    <span class="status">Online</span>
                </div>
            </div>
            <div class="header-actions">
                <button class="icon-btn" title="Search">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>
                </button>
                <button class="icon-btn" title="More options">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="12" cy="12" r="1"></circle>
                        <circle cx="12" cy="5" r="1"></circle>
                        <circle cx="12" cy="19" r="1"></circle>
                    </svg>
                </button>
            </div>
        </div>

        <div class="chat-messages" id="chatMessages">
            <div class="message received">
                <div class="message-avatar">A</div>
                <div class="message-content">
                    <div class="message-text">Hey! Welcome to Claw Chat.</div>
                    <div class="message-time">10:30 AM</div>
                </div>
            </div>

            <div class="message sent">
                <div class="message-content">
                    <div class="message-text">Thanks! This looks amazing!</div>
                    <div class="message-time">10:32 AM</div>
                </div>
            </div>

            <div class="message received">
                <div class="message-avatar">A</div>
                <div class="message-content">
                    <div class="message-text">I'm glad you like it! The black theme is sleek and modern.</div>
                    <div class="message-time">10:33 AM</div>
                </div>
            </div>

            <div class="message sent">
                <div class="message-content">
                    <div class="message-text">Absolutely! Perfect for a dark mode lover like me. 🌙</div>
                    <div class="message-time">10:34 AM</div>
                </div>
            </div>
        </div>

        <div class="chat-input-container">
            <button class="icon-btn attach-btn" title="Attach file">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"></path>
                </svg>
            </button>
            <div class="input-wrapper">
                <input 
                    type="text" 
                    id="messageInput" 
                    placeholder="Type a message..." 
                    autocomplete="off"
                />
            </div>
            <button class="icon-btn emoji-btn" title="Emoji">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <circle cx="12" cy="12" r="10"></circle>
                    <path d="M8 14s1.5 2 4 2 4-2 4-2"></path>
                    <line x1="9" y1="9" x2="9.01" y2="9"></line>
                    <line x1="15" y1="9" x2="15.01" y2="9"></line>
                </svg>
            </button>
            <button class="send-btn" id="sendBtn" title="Send message">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="22" y1="2" x2="11" y2="13"></line>
                    <polygon points="22 2 15 22 11 13 2 9 22 2"></polygon>
                </svg>
            </button>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
